    <main id="demo">
      <noscript>
        <h1>Zoetrope</h1>
        <p>
          An FFGL effect that prints your clip onto the cards of a spinning disc
          and shows you the disc only in the light of a strobe that fires on the
          music. Lock the disc to the tempo and the figures stand still and
          play; nudge it off and they crawl forwards or backwards; spin it by
          hand on the kicks and they jump. Nothing's animated by the plugin: the
          print head, the disc, the strobe and the camera do it all, and a Drum
          view shows the cards through slits the way the Victorians did.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/zoetrope">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/zoetrope/">Project page and downloads</a></li>
