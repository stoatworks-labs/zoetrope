    <title>Zoetrope — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Zoetrope FFGL effect for Resolume in your browser: your clip's frames printed on the cards of a spinning disc, seen only in the light of a strobe that fires on the beat — figures that stand still and play the clip, the wagon wheel's crawl, the smear of a long flash and the camera's own aliasing. The plugin's own C++ compiled unmodified to WebAssembly, drawing with its own GLSL in WebGL2, on a simulated BPM clock with no audio. A demo, not the plugin." />
    <link rel="icon" href="data:," />

    <main id="demo">
      <noscript>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/zoetrope">its repository</a>.
        </p>
      </noscript>
    </main>
